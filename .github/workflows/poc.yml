name: poc-review-comment-ref
on:
  pull_request_review_comment:
    types: [created]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.comment.body, '@probe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Variant marker
        run: |
          echo "VARIANT=main-v3"
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo "assoc=${{ github.event.comment.author_association }} actor=${{ github.actor }}"
          cat .claude/hooks/no-pipe-test-output.sh
          ls -1 from_pr_head.txt 2>/dev/null || echo no-marker
