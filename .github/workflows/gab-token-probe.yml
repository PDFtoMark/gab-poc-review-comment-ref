name: gab token probe
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo "headrepo=${{ github.event.pull_request.head.repo.full_name }} forkrepo=${{ github.event.pull_request.head.repo.fork }}"
          echo "baserepo=${{ github.event.pull_request.base.repo.full_name }}"
          echo "sender=${{ github.event.sender.login }} actor=${{ github.actor }}"
      - name: token write probe
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/labels" \
            -d '{"labels":["gab-token-probe"]}')
          echo "WRITE_STATUS=$code"
          head -c 300 /tmp/resp.json; echo
