name: gab token probe
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: context
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo "headrepo=${{ github.event.pull_request.head.repo.full_name }} fork=${{ github.event.pull_request.head.repo.fork }}"
          echo "sender=${{ github.event.sender.login }}"
      - name: token write probe
        run: |
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1/labels" -d '{"labels":["gab-token-probe"]}')
          echo "WRITE_STATUS=$code"
          head -c 300 /tmp/resp; echo
      - name: workspace probe
        run: |
          echo "--- root ls ---"; ls -1
          echo "--- marker ---"; cat PR_MARKER.txt 2>/dev/null || echo NO_MARKER
          echo "--- codeowners ---"; cat .github/CODEOWNERS 2>/dev/null || cat CODEOWNERS 2>/dev/null || echo NO_CODEOWNERS
